          - heading "Browser extension capture" [level=3] [ref=e138]
          - paragraph [ref=e139]: "The first-run experience should explain exactly what happens when a user highlights a line: where it is stored, what metadata comes with it, and how it becomes a review item later. That reduces the “is this just another clipper?” question immediately."
          - heading "Reader imports" [level=3] [ref=e140]
          - paragraph [ref=e141]: "Acorny should position reader imports as continuity, not ingestion for its own sake. The docs can frame imports around one promise: whatever tool you used to read, your review rhythm still happens in one place."
