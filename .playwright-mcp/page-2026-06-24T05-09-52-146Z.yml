            - generic [ref=e152]: Design note carried into docs
            - text: "MarkText’s docs feel trustworthy because the navigation, search, and reading column all stay disciplined. Acorny benefits from the same restraint: one accent, clean panels, and narrow prose."
          - heading "Spaced repetition" [level=3] [ref=e153]
          - paragraph [ref=e154]: Spaced repetition should be explained in product language, not textbook jargon. Users mainly need to understand that remembered cards move further out, while uncertain cards return sooner.
          - heading "Privacy & exports" [level=2] [ref=e155]
          - paragraph [ref=e156]: The current site already says reading data is private to the user account and that export matters. Those are powerful trust points. This docs direction gives them a dedicated place near the front instead of burying them deep in FAQ copy.
          - list [ref=e157]:
            - listitem [ref=e158]: Highlights are private unless the user chooses to share them.
            - listitem [ref=e159]: Exports matter because reading data is part of the user’s knowledge base.
            - listitem [ref=e160]: Permission scopes should be explained in the context of capture and restore, not generic tracking language.
          - heading "FAQ" [level=2] [ref=e161]
          - paragraph [ref=e162]: Use the FAQ as a friction reducer, not as the main sales layer. Questions about pricing, future paid features, exports, and browser permissions should remain, but they should come after the user already understands the product loop.
